version: '3.8'

services:
  samap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samap_study_companion
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=samap-delusional-super-secret-key-production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - samap_data:/app/data

volumes:
  samap_data:
    driver: local
